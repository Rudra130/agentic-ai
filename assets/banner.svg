<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .cyber-grid {
        stroke: rgba(99, 102, 241, 0.08);
        stroke-width: 1;
      }
      .pulse-circle {
        animation: pulse 3.5s ease-in-out infinite;
      }
      .orbit-dot {
        animation: orbit 10s linear infinite;
        transform-origin: 450px 130px;
      }
      .stream-line {
        stroke-dasharray: 200, 400;
        animation: stream 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .tag-glow {
        animation: tagPulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes stream {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }
      @keyframes tagPulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
        100% { filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.7)); }
      }
      @keyframes typing {
        0%, 20% { opacity: 0; }
        30%, 80% { opacity: 1; }
        90%, 100% { opacity: 0; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .mono-text {
        font-family: "JetBrains Mono", Consolas, Menlo, Monaco, "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cyber Grid Pattern -->
  <g class="cyber-grid">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="90" x2="900" y2="90" />
    <line x1="0" y1="140" x2="900" y2="140" />
    <line x1="0" y1="190" x2="900" y2="190" />
    <line x1="0" y1="230" x2="900" y2="230" />
    <line x1="100" y1="0" x2="100" y2="260" />
    <line x1="250" y1="0" x2="250" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="650" y1="0" x2="650" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />
  </g>

  <!-- Glowing Orbs in background -->
  <circle cx="150" cy="70" r="120" fill="#38bdf8" opacity="0.06" class="pulse-circle" filter="url(#neonGlow)" />
  <circle cx="780" cy="190" r="140" fill="#c084fc" opacity="0.08" class="pulse-circle" filter="url(#neonGlow)" style="animation-delay: -1.8s;" />

  <!-- Animated Data Streams -->
  <path d="M 50,130 Q 250,50 450,130 T 850,130" fill="none" stroke="url(#wireGrad)" stroke-width="2.5" class="stream-line" filter="url(#softGlow)" />
  <path d="M 50,140 Q 250,210 450,130 T 850,130" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" class="stream-line" style="animation-delay: -2s;" />

  <!-- Header Badge -->
  <g transform="translate(330, 28)">
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" fill="#a5b4fc" font-size="11" class="mono-text" font-weight="600" letter-spacing="1">AGENTIC INTELLIGENCE SUITE</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="98" text-anchor="middle" fill="url(#neonText)" font-size="44" class="title-text" filter="url(#softGlow)">
    AGENTIC AI ECOSYSTEM
  </text>

  <!-- Subtitle with Typing Indicator -->
  <g transform="translate(450, 134)">
    <text text-anchor="middle" fill="#94a3b8" font-size="14.5" class="mono-text">
      LangGraph State Machines &#x2022; Multi-Server MCP Architecture &#x2022; LangChain v1.4+
    </text>
  </g>

  <!-- Animated Tech Chips / Badges -->
  <g transform="translate(110, 175)" class="tag-glow">
    <!-- LangChain -->
    <g transform="translate(0, 0)">
      <rect width="125" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="62" y="22" text-anchor="middle" fill="#38bdf8" font-size="12" class="mono-text" font-weight="bold">&#x26A1; LangChain</text>
    </g>

    <!-- LangGraph -->
    <g transform="translate(140, 0)">
      <rect width="130" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#818cf8" stroke-width="1.2" />
      <text x="65" y="22" text-anchor="middle" fill="#818cf8" font-size="12" class="mono-text" font-weight="bold">&#x1F578;&#xFE0F; LangGraph</text>
    </g>

    <!-- Model Context Protocol -->
    <g transform="translate(285, 0)">
      <rect width="130" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#c084fc" stroke-width="1.2" />
      <text x="65" y="22" text-anchor="middle" fill="#c084fc" font-size="12" class="mono-text" font-weight="bold">&#x1F9E9; FastMCP</text>
    </g>

    <!-- NVIDIA Nemotron -->
    <g transform="translate(430, 0)">
      <rect width="135" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#10b981" stroke-width="1.2" />
      <text x="67" y="22" text-anchor="middle" fill="#10b981" font-size="12" class="mono-text" font-weight="bold">&#x1F916; NVIDIA AI</text>
    </g>

    <!-- UV Environment -->
    <g transform="translate(580, 0)">
      <rect width="100" height="34" rx="8" fill="url(#badgeGrad1)" stroke="#f472b6" stroke-width="1.2" />
      <text x="50" y="22" text-anchor="middle" fill="#f472b6" font-size="12" class="mono-text" font-weight="bold">&#x1F680; UV PKG</text>
    </g>
  </g>

  <!-- Bottom decorative status bar -->
  <g transform="translate(50, 235)">
    <circle cx="10" cy="5" r="3" fill="#38bdf8" />
    <text x="22" y="8" fill="#64748b" font-size="10.5" class="mono-text">STATUS: PRODUCTION-READY STATEFUL AGENT</text>
    
    <text x="800" y="8" text-anchor="end" fill="#64748b" font-size="10.5" class="mono-text">PYTHON >= 3.12 &#x2022; ASYNC-FIRST</text>
  </g>
</svg>
